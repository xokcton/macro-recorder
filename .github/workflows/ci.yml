name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Системные зависимости egui/winit
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libx11-dev libxtst-dev libxi-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # evdev-бэкенд (Wayland, фаза W1) выключен по умолчанию — проверяем отдельно,
      # чтобы экспериментальный код не гнил без clippy.
      - run: cargo clippy -p mrcore --features evdev --all-targets -- -D warnings
      # Приложение с wayland-фичами (W3): форвард evdev + портал хоткеев.
      - run: cargo clippy -p macro-recorder-app --features evdev,portal-hotkeys --all-targets -- -D warnings
      # CLI: --backend evdev для headless-воспроизведения на чистом Wayland.
      - run: cargo clippy -p macro-recorder-cli --features evdev --all-targets -- -D warnings

  tests:
    name: test workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Системные зависимости (только Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libx11-dev libxtst-dev libxi-dev
      # Дисплей и реальный ввод не нужны: ядро тестируется на MockBackend,
      # тесты app/cli — чистая логика. Но тестовые бинарники app линкуют
      # полный граф GUI-зависимостей, поэтому на Linux нужен и GTK-набор.
      - run: cargo test --workspace --verbose
      - name: тесты evdev-маппингов (только Linux)
        if: runner.os == 'Linux'
        run: cargo test -p mrcore --features evdev --lib --verbose
      - name: тесты портальных хоткеев (только Linux)
        if: runner.os == 'Linux'
        run: cargo test -p macro-recorder-app --features evdev,portal-hotkeys --verbose
      - name: тесты CLI с --backend evdev (только Linux)
        if: runner.os == 'Linux'
        run: cargo test -p macro-recorder-cli --features evdev --verbose

  build-app:
    name: build app (${{ matrix.os }})
    needs: [lint, tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Системные зависимости (только Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libx11-dev libxtst-dev libxi-dev
      - run: cargo build --workspace --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: macro-recorder-${{ matrix.os }}
          path: |
            target/release/macro-recorder
            target/release/macro-recorder.exe
          if-no-files-found: ignore
